<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/images/icon-dark.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/assets/images/icon-white.svg"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Raster fallback for Safari, which doesn't reliably render SVG favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="light dark" />
    <title>Agentrove</title>
  </head>
  <body>
    <script>
      // Mirrors useAppliedPalette + App's theme effect. vite.config.ts
      // injects DARK_THEMES, the app's dark set derived from src/styles/palettes.ts.
      (function initTheme() {
        var DARK_THEMES = __DARK_THEMES__;
        var root = document.documentElement;
        var stored = { theme: 'dark', systemLightTheme: 'light', systemDarkTheme: 'dark' };
        try {
          var persisted = JSON.parse(localStorage.getItem('ui-storage'));
          // Same as the store's shallow merge: any persisted value wins.
          if (persisted && persisted.state) {
            for (var key in stored) {
              if (key in persisted.state) stored[key] = persisted.state[key];
            }
          }
        } catch (error) {}
        var palette = stored.theme;
        if (palette === 'system') {
          palette =
            window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches
              ? stored.systemLightTheme
              : stored.systemDarkTheme;
        }
        var resolved = DARK_THEMES.indexOf(palette) !== -1 ? 'dark' : 'light';
        root.setAttribute('data-theme', resolved);
        root.setAttribute('data-palette', palette);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          var surface = window.getComputedStyle(root).backgroundColor;
          var styled = surface && surface !== 'transparent' && surface !== 'rgba(0, 0, 0, 0)';
          var fallback = resolved === 'dark' ? '#111111' : '#f5f5f5';
          meta.setAttribute('content', styled ? surface : fallback);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
