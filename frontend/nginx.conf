server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver; resolve upstreams at request time
    resolver 127.0.0.11 valid=30s;

    # Proxy API requests to backend
    location /api {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy admin requests to backend
    location /admin {
        set $admin_upstream http://api:8080;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy OpenVSCode Server (host-mode sandboxes)
    # OpenVSCode is started with --server-base-path /ide/ so it expects to be served here.
    location /ide/ {
        set $ide_upstream http://api:8765;
        proxy_pass $ide_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback - serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
