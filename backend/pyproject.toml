[tool.ruff]
# Same as Black.
line-length = 88

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "migrations",
    "venv",
    "env",
    ".env",
    ".venv",
]

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules.
select = ["E", "F", "B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Ignore specific rules that are common in FastAPI apps
ignore = [
    "B008",  # Do not perform function call in argument defaults (common in FastAPI with Depends)
    "E501",  # Line too long (handled by formatter)
    "B904",  # Use 'raise ... from err' (would require many changes)
    "B006",  # Do not use mutable data structures for argument defaults
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
strict_equality = true
extra_checks = true
exclude = [
    "migrations/",
    "venv/",
]
[[tool.mypy.overrides]]
module = [
    "redis.*",
    "sqladmin.*",
    "sse_starlette.*",
    "prometheus_fastapi_instrumentator.*",
    "uvicorn.*",
    "acp.*",
    "yaml",
    "fastapi_users.*",
    "fastapi_users_db_sqlalchemy.*",
]
ignore_missing_imports = true

# sqladmin uses metaclass magic for ModelView(model=Model) syntax that mypy cannot understand
# See: https://github.com/python/mypy/issues/11057
[[tool.mypy.overrides]]
module = "app.admin.views"
disable_error_code = ["call-arg"]

[tool.deptry]
known_first_party = ["app"]
ignore_notebooks = true
exclude = [
    "migrations/",
    "venv/",
    ".venv/",
]

[tool.deptry.package_module_name_map]
"python-jose" = "jose"
"PyYAML" = "yaml"
"python-json-logger" = "pythonjsonlogger"
"email-validator" = "email_validator"
"fastapi-users" = "fastapi_users"
"python-multipart" = "multipart"
"pydantic-settings" = "pydantic_settings"
"agent-client-protocol" = "acp"
"prometheus-fastapi-instrumentator" = "prometheus_fastapi_instrumentator"
"sse-starlette" = "sse_starlette"

[tool.deptry.per_rule_ignores]
DEP001 = [
    "pytest",
    "pytest_asyncio",
    # app/browser_mcp_cloud.py runs under the isolated /app/browser-use venv's
    # interpreter (see backend/Dockerfile), never imported by the backend app.
    "browser_use",
]
DEP002 = [
    "aiosqlite",
    "python-multipart",
    "bcrypt",
    "email-validator",
    # Imported by the bundled mcp-server/ (outside backend/), which the backend
    # spawns at runtime — not imported by backend source, so deptry can't see it.
    "mcp",
]