[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrove-mcp"
version = "0.1.0"
description = "MCP server exposing AgentRove chat tools (create_chat, create_message, get_messages)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.19.0",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["server", "client"]
