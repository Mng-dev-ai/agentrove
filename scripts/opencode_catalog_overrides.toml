# Hand-maintained inputs for scripts/sync_opencode_catalog.py. Everything else in
# backend/app/catalog/opencode.py comes from https://models.dev/api.json.

# The run fails instead of writing a catalog smaller than this.
min_models = 500

# Provider allow-list, in output order: models.dev provider id = label used in
# display names ("<model name> (<label>)").
[providers]
opencode = "OpenCode"
opencode-go = "Opencode Go"
amazon-bedrock = "Amazon Bedrock"
deepseek = "Deepseek"
github-copilot = "Github Copilot"
google = "Google"
google-vertex = "Google Vertex"
openai = "Openai"
openrouter = "Openrouter"
perplexity-agent = "Perplexity Agent"
zai-coding-plan = "Zai Coding Plan"

# Model name to show instead of the models.dev one, keyed "<provider>/<model>".
[display_names]
"opencode/deepseek-v4.1-flash" = "DeepSeek V4.1 Flash"
"opencode-go/deepseek-v4.1-flash" = "DeepSeek V4.1 Flash"
"deepseek/deepseek-flash" = "DeepSeek V4.1 Flash"
"openrouter/gryphe/mythomax-l2-13b" = "MythoMax 13B"
"openrouter/openai/gpt-audio" = "GPT Audio"
"openrouter/openai/gpt-audio-mini" = "GPT Audio Mini"
"openrouter/qwen/qwen-2.5-coder-32b-instruct" = "Qwen2.5 Coder 32B Instruct"
"openrouter/qwen/qwen2.5-vl-72b-instruct" = "Qwen2.5 VL 72B Instruct"
"openrouter/qwen/qwen3-235b-a22b-thinking-2507" = "Qwen3 235B A22B Thinking 2507"
"openrouter/qwen/qwen3-30b-a3b-instruct-2507" = "Qwen3 30B A3B Instruct 2507"
"openrouter/z-ai/glm-5.3-flashx-legal" = "GLM 5.3 FlashX Legal"

# Models models.dev does not list (or lists as deprecated) that live
# `opencode models` still offers. A live models.dev entry takes precedence.
[keep."openai/gpt-5.4-fast"]
name = "GPT-5.4 Fast"
context_window = 1_050_000

[keep."openai/gpt-5.4-mini-fast"]
name = "GPT-5.4 mini Fast"
context_window = 400_000

[keep."github-copilot/claude-opus-4.8-fast"]
name = "Claude Opus 4.8 Fast"
context_window = 200_000

