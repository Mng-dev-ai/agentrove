name: WebView Bench

on:
  push:
    branches:
      - worktree-fb0d8e44
      - 'bench/**'

jobs:
  bench:
    name: WKWebView vs Electron (${{ matrix.group }})
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: ab-wkwebview-fixed
            hosts: wkwebview
            scenarios: mem_fixed@main mem_fixed@fix cells_5k_plain@main cells_5k_plain@fix
          - group: ab-wkwebview-timed
            hosts: wkwebview
            scenarios: mem_timed@main mem_timed@fix
          - group: ab-electron-fixed
            hosts: electron
            scenarios: mem_fixed@main mem_fixed@fix cells_5k_plain@main cells_5k_plain@fix
          - group: ab-electron-timed
            hosts: electron
            scenarios: mem_timed@main mem_timed@fix
    env:
      API_PORT: '18741'
      WEB_PORT: '18742'
      WEB_PORT_MAIN: '18743'
      MAIN_SHA: ccb7a17d1e014de00ddd50ef40d3e17a580aba54
      FIX_SHA: 45d8d77bf54459ca519ac610306e01b64060761c
      BENCH_RUNS: '6'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install backend and bench Python dependencies
        run: |
          uv venv "$RUNNER_TEMP/venv" --python 3.12
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install -r backend/requirements.lock scipy

      - name: Install Electron
        working-directory: bench/webview/electron
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js
          npx electron --version

      - name: Build WKWebView host
        working-directory: bench/webview
        run: swiftc -O wkhost/main.swift -o "$RUNNER_TEMP/wkhost" -framework AppKit -framework WebKit

      - name: Build frontends (main and fix)
        env:
          VITE_API_BASE_URL: http://127.0.0.1:${{ env.API_PORT }}/api/v1
          VITE_WS_URL: ws://127.0.0.1:${{ env.API_PORT }}/api/v1/ws
        run: |
          git fetch --no-tags --depth=1 origin "$MAIN_SHA" "$FIX_SHA"
          for pair in "main:$MAIN_SHA" "fix:$FIX_SHA"; do
            name="${pair%%:*}"
            src="$RUNNER_TEMP/src-$name"
            mkdir -p "$src"
            git archive "${pair#*:}" frontend | tar -x -C "$src"
            (cd "$src/frontend" && npm ci --legacy-peer-deps --no-audit --no-fund && npx vite build --mode desktop --outDir "$RUNNER_TEMP/dist-$name")
          done

      - name: Collect environment
        working-directory: bench/webview
        run: python3 env_info.py "$RUNNER_TEMP/env.json"

      - name: Seed fixtures
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
          BENCH_TMP: ${{ runner.temp }}/bench
          WEB_ORIGIN: http://127.0.0.1:${{ env.WEB_PORT }},http://127.0.0.1:${{ env.WEB_PORT_MAIN }}
        run: bench/webview/backend.sh seed

      - name: Start backend and static server
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
          BENCH_TMP: ${{ runner.temp }}/bench
          WEB_ORIGIN: http://127.0.0.1:${{ env.WEB_PORT }},http://127.0.0.1:${{ env.WEB_PORT_MAIN }}
        run: |
          nohup bench/webview/backend.sh serve > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup python3 bench/webview/static_server.py --dir "$RUNNER_TEMP/dist-fix" --port "$WEB_PORT" > "$RUNNER_TEMP/static.log" 2>&1 &
          nohup python3 bench/webview/static_server.py --dir "$RUNNER_TEMP/dist-main" --port "$WEB_PORT_MAIN" > "$RUNNER_TEMP/static-main.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf "http://127.0.0.1:$API_PORT/health" >/dev/null && curl -sf "http://127.0.0.1:$WEB_PORT/" >/dev/null && curl -sf "http://127.0.0.1:$WEB_PORT_MAIN/" >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run benchmark
        run: |
          ELECTRON_BIN="$(cd bench/webview/electron && node -p "require('electron')")"
          ls -la "$ELECTRON_BIN"
          "$RUNNER_TEMP/venv/bin/python" bench/webview/orchestrate.py \
            --fixture "$RUNNER_TEMP/bench/fixture.json" \
            --api "http://127.0.0.1:$API_PORT/api/v1" \
            --web "http://127.0.0.1:$WEB_PORT" \
            --out "$RUNNER_TEMP/out" \
            --driver bench/webview/driver.js \
            --wkhost "$RUNNER_TEMP/wkhost" \
            --electron-bin "$ELECTRON_BIN" \
            --electron-app bench/webview/electron \
            --runs "$BENCH_RUNS" \
            --hosts ${{ matrix.hosts }} \
            --builds "main=http://127.0.0.1:$WEB_PORT_MAIN" "fix=http://127.0.0.1:$WEB_PORT" \
            --scenarios ${{ matrix.scenarios }}

      - name: Report
        if: always()
        run: |
          "$RUNNER_TEMP/venv/bin/python" bench/webview/report.py \
            --results "$RUNNER_TEMP/out/results.jsonl" \
            --env "$RUNNER_TEMP/env.json" \
            --fixture "$RUNNER_TEMP/bench/fixture.json" \
            --summary-json "$RUNNER_TEMP/out/summary.json" \
            --markdown "$RUNNER_TEMP/out/summary.md"
          cp "$RUNNER_TEMP/env.json" "$RUNNER_TEMP/out/env-${{ matrix.group }}.json"
          cp "$RUNNER_TEMP/bench/fixture.json" "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/out/"
          mkdir -p "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP/out/raw"
          find . -name '*.png' | while read -r f; do
            cp "$f" "$RUNNER_TEMP/shots/$(echo "${f#./}" | tr '/' '_')"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-bench-results-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/out
            !${{ runner.temp }}/out/raw/**/*.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-bench-screenshots-${{ matrix.group }}
          path: ${{ runner.temp }}/shots

  report:
    name: Merged report
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: webview-bench-results-*
          path: ${{ runner.temp }}/groups

      - name: Report
        run: |
          pip install scipy
          cd "$RUNNER_TEMP/groups"
          mkdir -p "$RUNNER_TEMP/merged"
          cat */results.jsonl > "$RUNNER_TEMP/merged/results.jsonl"
          python "$GITHUB_WORKSPACE/bench/webview/report.py" \
            --results "$RUNNER_TEMP/merged/results.jsonl" \
            --env */env-*.json \
            --fixture "$(ls */fixture.json | head -1)" \
            --summary-json "$RUNNER_TEMP/merged/summary.json" \
            --markdown "$RUNNER_TEMP/merged/summary.md"
          cat "$RUNNER_TEMP/merged/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webview-bench-summary
          path: ${{ runner.temp }}/merged
