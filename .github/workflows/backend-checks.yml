name: Backend Checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'sandbox/**'
      - 'scripts/**'
      - 'mcp-server/**'
      - 'desktop/requirements*'
      - 'desktop/run_build.mjs'
      - 'frontend/src/test/agentPermissionModes.json'
      - 'frontend/src/test/streamEnvelopes.json'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'sandbox/**'
      - 'scripts/**'
      - 'mcp-server/**'
      - 'desktop/requirements*'
      - 'desktop/run_build.mjs'
      - 'frontend/src/test/agentPermissionModes.json'
      - 'frontend/src/test/streamEnvelopes.json'
      - '.github/workflows/backend-checks.yml'

jobs:
  lint:
    name: Lint Backend Code
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-
      
      - name: Install linting tools
        run: pip install ruff==0.15.0 mypy types-redis deptry pip-audit

      - name: Run ruff linting
        run: |
          cd backend
          ruff check . ../mcp-server

      - name: Run ruff formatting check
        run: |
          cd backend
          ruff format --check . ../mcp-server

      - name: Run mypy type checking
        run: |
          cd backend
          mypy app/
          mypy --config-file pyproject.toml ../mcp-server

      - name: Run deptry dependency checks
        run: |
          cd backend
          deptry . --requirements-files requirements.txt

      - name: Check desktop requirements.lock is fresh
        run: |
          pip install uv==0.13.10
          uv pip compile backend/requirements-core.txt -c backend/requirements.lock -o desktop/requirements.lock --python-version 3.12 --python-platform aarch64-apple-darwin --quiet
          git diff --exit-code desktop/requirements.lock

      - name: Run pip-audit vulnerability scan
        continue-on-error: true
        run: pip-audit -r backend/requirements.lock

  tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/requirements.lock
          activate-environment: true

      # The lockfile matches the API image; mcp==1.19.0 doesn't import under the
      # newest pydantic that requirements.txt would resolve.
      - name: Install test dependencies
        run: uv pip install -r backend/requirements.lock pytest pytest-asyncio pytest-cov pytest-xdist ruff==0.15.0

      - name: Run backend tests
        # sysmon core: the default C tracer drops lines executed through
        # SQLAlchemy's greenlet switches, under-reporting request handlers.
        env:
          COVERAGE_CORE: sysmon
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          pytest tests -n auto --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85 --durations=20
