name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and notarize without publishing a release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and Publish Desktop Release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Set version from tag
        if: ${{ !inputs.validate_only }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd frontend/src-tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: frontend
          tauriScript: npx tauri
          tagName: ${{ !inputs.validate_only && github.ref_name || '' }}
          releaseName: Agentrove Desktop ${{ github.ref_name }}
          releaseBody: Desktop release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}


      - name: Verify notarized app
        if: ${{ inputs.validate_only }}
        run: |
          APP="$GITHUB_WORKSPACE/frontend/src-tauri/target/release/bundle/macos/Agentrove.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          SIDECAR="$APP/Contents/Resources/_up_/backend-sidecar"
          "$SIDECAR/python/bin/python3" -c 'import ssl, pydantic_core, uvloop, watchfiles, sqlalchemy'
          "$SIDECAR/node/bin/node" -e 'if (new Function("return 42")() !== 42) process.exit(1)'
