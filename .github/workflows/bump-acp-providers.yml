name: Bump ACP Providers

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  bump:
    name: Bump ACP Providers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump pinned versions
        run: scripts/bump-acp-providers.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.15.0

      # A models.dev outage must not block the CLI bumps: the generator leaves the
      # catalog untouched on failure and the next run retries.
      - name: Refresh OpenCode model catalog
        id: catalog
        continue-on-error: true
        run: python scripts/sync_opencode_catalog.py

      - name: Detect image changes
        id: changes
        run: git diff --quiet -- scripts/acp-providers.env backend/Dockerfile sandbox/docker/Dockerfile || echo "images=true" >> "$GITHUB_OUTPUT"

      # github.token PRs need a manual approval before pull_request checks run, so verify here.
      - name: Build images and smoke-test CLIs
        if: steps.changes.outputs.images == 'true'
        uses: ./.github/actions/docker-smoke

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BUMP_PR_TOKEN || github.token }}
          branch: bot/bump-acp-providers
          delete-branch: true
          commit-message: 'chore: bump ACP providers'
          title: 'chore: bump ACP providers'
          body: |
            Pins Claude Code, claude-agent-acp, codex-acp, Codex, Copilot, OpenCode, Cursor CLI, Antigravity, and Grok to their latest releases in `scripts/acp-providers.env`, which `backend/Dockerfile`, `sandbox/docker/Dockerfile`, and `desktop/run_build.mjs` read.

            Regenerates `backend/app/catalog/opencode.py` from models.dev and `scripts/opencode_catalog_overrides.toml`. Catalog refresh in this run: ${{ steps.catalog.outcome }} (on `failure` the catalog is unchanged; see the run log).

            Generated by `scripts/bump-acp-providers.sh` and `scripts/sync_opencode_catalog.py`.
